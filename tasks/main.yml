---

- name: Include installation tasks per OS family
  ansible.builtin.include_tasks:
    file: "install/{{ ansible_facts.os_family }}.yml"
    apply:
      tags: install
  tags: install

- name: Configure global section
  ansible.builtin.lineinfile:
    path: "{{ gitlab_runner_config_file }}"
    regexp: "^{{ item.key }} = (.*)$"
    line: "{{ item.key }} = {{ item.value }}"
    state: present
  with_dict: "{{ gitlab_runner_config_global }}"
  when: gitlab_runner_config_global | length > 0
  notify: Restart systemd service
  tags: config

- name: Create template directory
  ansible.builtin.file:
    path: "{{ gitlab_runner_config_templates_dir }}"
    state: directory
  when: gitlab_runner_config_templates | length > 0
  tags: config

- name: Copy configuration templates
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ gitlab_runner_config_templates_dir }}/{{ item | basename }}"
  loop: "{{ gitlab_runner_config_templates }}"
  when: gitlab_runner_config_templates | length > 0
  tags: config

- name: Include registration tasks
  ansible.builtin.include_tasks:
    file: register.yml
    apply:
      tags: register
  loop: "{{ gitlab_runner_register_runners }}"
  when: gitlab_runner_register_runners | length > 0
  no_log: true
  tags: register
