---

# Setup this variable to true in order to install the latest release.
gitlab_runner_package_latest: true

# Specify the version of GitLab Runner to install.
# Requires `gitlab_runner_package_latest=false`.
gitlab_runner_package_version: ""

# Configure global section using yaml dictionary.
# ref: https://docs.gitlab.com/runner/configuration/advanced-configuration/#the-global-section
#
# Define key-value pairs that will be converted into toml syntax.
#
# Example:
#   gitlab_runner_config_global:
#     concurrent: 10
#     log_level: info
#     log_format: json
#     ...
#
gitlab_runner_config_global: {}

# Upload user-defined configuration templates that can be reused when
# registering runners and configure their executors. A template is convenient
# when specifying advanced configurations in spite of listing them as arguments
# and parameters to `gitlab-runner register` command.
# ref: https://docs.gitlab.com/runner/register/#register-with-a-configuration-template
#
# Example:
#   gitlab_runner_config_templates:
#     - docker-unprivileged.toml
#     - "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/docker-privileged.toml"
#
gitlab_runner_config_templates: []

# Register runners and configure their executors using non-interactive mode.
# ref:
#   - https://docs.gitlab.com/runner/register 
#   - https://docs.gitlab.com/runner/executors/
#
# Mandatory fields:
#   - `name`: name of the runner.
#   - `url`: URL of the GitLab server.
#   - `token`: registration token issued by the server for this runner.
#   - `executor`: type of executor supported by the runner.
#
# Optional fields:
#   - `template`: name of the configuration template file present on the host
#                 (see `gitlab_runner_config_templates` variable).
#   - `extra_args`: a list of additional arguments to pass to register command.
#
# Example:
#   gitlab_runner_register_runners
#     - name: docker
#       url: https://gitlab.example.org
#       token: GITLAB_AUTH_TOKEN
#       executor: docker
#       template: docker-privileged.toml
#       extra_args:
#         - --docker-image alpine:latest
#
gitlab_runner_register_runners: []
